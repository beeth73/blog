<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beeth73 | log</title>
    
    <meta name="description" content="Technical Blog by Beeth73 in the webpage also designed by him, hope you enjoy!">
    <meta name="theme-color" content="#f7f3ea" id="meta-theme-color">

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Fira+Code:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Google+Sans+Code:wght@400..700&display=swap" rel="stylesheet">

    <!-- CSS Engine -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Prevent FOIT -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme === 'dark' || (!savedTheme && prefersDark) ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            
            const metaColor = theme === 'dark' ? '#1a1a1a' : '#f7f3ea';
            document.getElementById('meta-theme-color').setAttribute('content', metaColor);
        })();
    </script>
</head>
<body>

    <!-- Skip Link for Keyboard Users -->
    <a href="#content-bridge" class="skip-link">Skip to main content</a>

    <!-- [HEADER & NAV] -->
    <header class="site-header">
        <nav id="main-nav" aria-label="Primary Navigation">
            <div class="nav-links">
                <a href="index.html" class="nav-item">~/home</a>
                <a href="?list=all" class="nav-item">~/posts</a>
            </div>
            
            <!-- Dynamic Layout Controls -->
            <div class="nav-controls">
                <button id="font-decrease" class="font-control" aria-label="Decrease font size">A-</button>
                <button id="font-increase" class="font-control" aria-label="Increase font size">A+</button>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
                    <span class="toggle-icon" aria-hidden="true">[moon]</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- [CONTENT] -->
    <main id="content-bridge" tabindex="-1">
        
        <!-- Interactive Sliders (Protected) -->
        <div id="slider-left" class="column-slider" aria-label="Adjust left margin" role="slider" tabindex="0">+</div>
        <div id="slider-right" class="column-slider" aria-label="Adjust right margin" role="slider" tabindex="0">▷</div>
        
        <!-- Dedicated article container (Sandboxed) -->
        <div id="article-renderer">
            <div id="loader" class="loader" role="status" aria-live="polite">
                <span class="loader-text">Initializing Engine...</span>
                <span class="blinking-cursor" aria-hidden="true">_</span>
            </div>
        </div>
        
    </main>

    <!-- [FOOTER] -->
    <footer class="site-footer">
        <p>rendered via <span class="wasm-badge">.wat</span> // engineered by beeth73</p>
    </footer>

    <!-- App Logic -->
    <script src="assets/js/wasm_loader.js" type="module"></script>
    <script src="assets/js/app.js" type="module"></script>
</body>
</html>
