name: "CodeQL Advanced (DEFCON Hardened)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual execution from the Actions tab on-demand

# Strict Zero-Trust Defaults: Block all API permissions globally
permissions: {}

jobs:
  analyze:
    name: CodeQL Static Analysis (JS/TS)
    runs-on: ubuntu-latest
    
    # Strictly define the absolute bare-minimum permissions required to run
    permissions:
      contents: read             # Required to checkout and read repository files
      security-events: write     # Required to upload the resulting SARIF scanning report

    steps:
    # 1. Checkout Repository
    # Pinned to actions/checkout v4.2.2 SHA
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false # Threat reduction: Do not persist GitHub tokens on the runner

    # 2. Initialize CodeQL Compiler Environment
    # Pinned to github/codeql-action/init v4.37.1 SHA (Sub-action isolated)
    - name: Initialize CodeQL
      uses: github/codeql-action/init@df31c35ab213d8530b0a62722336d898938340b2 # v4.37.1
      with:
        languages: javascript-typescript
        build-mode: none 
        
        # Threat Modeling: Scan against deep semantic flaws, logic vulnerabilities, and code quality issues
        queries: security-extended,security-and-quality

    # 3. Execute Analysis & Publish Report
    # Pinned to github/codeql-action/analyze v4.37.1 SHA (Sub-action isolated)
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@df31c35ab213d8530b0a62722336d898938340b2 # v4.37.1
      with:
        category: "/language:javascript-typescript"
